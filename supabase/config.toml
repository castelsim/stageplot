project_id = "vsodplqkuvnsdiikvmjb"

# Versiona l'autenticazione richiesta dalle Edge Functions: le funzioni pubbliche
# verificano autonomamente token/firma quando applicabile; le altre richiedono JWT.
[functions.create-consultation]
verify_jwt = true

[functions.get-shared-project]
verify_jwt = false

# L'identita' la verifica la function stessa dal Bearer: verify_jwt=true qui rifiuterebbe con 401
# la chiamata di chi non ha fatto login, e quella non e' una condizione d'errore — e' la normalita'
# di chi apre l'editor senza account. Un anonimo riceve una lista vuota, non un errore.
[functions.my-feedback-replies]
verify_jwt = false

[functions.process-consultation-notifications]
verify_jwt = false

[functions.save-shared-project]
verify_jwt = true

[functions.setup-request]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.submit-feedback]
verify_jwt = false

# La landing è una pagina pubblica senza login: chi la visita non ha nessun token da mostrare.
[functions.track-landing]
verify_jwt = false

# Orchestre: la porta del musicista convocato (token nel link, verifica dentro la function) e il worker
# delle convocazioni (segreto nell'header, come il worker delle consulenze).
[functions.orc-respond]
verify_jwt = false

[functions.orc-notify]
verify_jwt = false

# Manda subito le email di una richiesta «Richiedi musicisti»: la chiama la pagina del cliente, quindi il
# JWT lo verifica Supabase. Dentro si controlla comunque che la richiesta sia di chi chiama.
[functions.orc-request-notify]
verify_jwt = true
